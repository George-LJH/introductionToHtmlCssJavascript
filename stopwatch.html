<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <link rel="stylesheet" href = "stopwatchStyle.css"/>
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />

</head>

<body>
    <div class="topBar">
        <button id="menuButton" type="button" aria-expanded="false" aria-controls="menu">
            Menu
        </button>
        <h1>Stopwatch</h1>
    </div>

    <nav id="menu" hidden>
        <button id="clearButton" type="button" onclick="clearTimes(event)">Clear times</button>
    </nav>

    <span id="time" class="timer">0</span>
    <div class="table-wrapper">
        <div id="wrapper"></div>
    </div>
    

    

    <script src="https://unpkg.com/gridjs/dist/gridjs.production.min.js"></script>
    
    <script> 
        var timeList = JSON.parse(localStorage.getItem("times")) || [];
        var dateList = JSON.parse(localStorage.getItem("dates")) || [];
        var timeGrid;
        function preventSpaceButtonClick(event) {
            if (event.key === " ") {
                event.preventDefault();
                event.currentTarget.blur();
            }
        }
        function applySpaceClickPrevention(button) {
            if (!button) return;
            button.addEventListener("keydown", preventSpaceButtonClick);
        }
        function clearTimes(event) {
            event.currentTarget.blur();
            localStorage.removeItem("times");
            localStorage.removeItem("dates");
            timeList = [];
            dateList = [];
            loadTimeListGrid("wrapper");
        }
        // alert(timeList);
        loadTimeListGrid("wrapper");
        window.addEventListener("keyup", function(event) {
            if (event.key == " " && !timerStarted) {
                startStopwatch();
            }
        });
        var time = new Date();
        var curTime = time.getTime();
        var timer;
        var timerStarted = false;
        var startTime;
        var formattedTime;
        const timeDisp = document.getElementById("time");

        document.getElementById("time").innerHTML = `00:00:000`
        timeDisp.style.color = "red";
        function startStopwatch() {
            if (timerStarted) {
                clearInterval(timer);
                timerStarted = false;
                timeDisp.style.color = "red"; 
                console.log(formattedTime);

                const dateString = getTimeAndDateStyled();
                timeList.push(formattedTime);
                dateList.push(dateString);

                localStorage.setItem("times", JSON.stringify(timeList));
                localStorage.setItem("dates", JSON.stringify(dateList));
                loadTimeListGrid("wrapper");
            } else {
                startTimeBase = new Date();
                var startTime = startTimeBase.getTime();
                timer = setInterval(function() {
                    time = new Date();
                    curTime = time.getTime();
                    totalTime = curTime - startTime;
                    var minutes = Math.floor(totalTime / 60000).toString().padStart(2, '0');
                    var seconds = Math.floor((totalTime % 60000) / 1000).toString().padStart(2, '0');
                    var milliseconds = (totalTime % 1000).toString().padStart(3, '0');
                    formattedTime = `${minutes}:${seconds}:${milliseconds}`;
                    document.getElementById("time").innerHTML = formattedTime;
                },10);
                timerStarted = true;
                timeDisp.style.color = "green"; 
            }
            
        }
        function loadTimeListGrid(wrapperId) {
            const wrapper = document.getElementById(wrapperId);
            const rows = timeList
                .slice()
                .reverse()
                .map((timeValue, index) => {
                    const dateValue = dateList[dateList.length - 1 - index] || "";
                    return [dateValue, timeValue];
                });

            if (timeGrid) {
                timeGrid.updateConfig({ data: rows }).forceRender();
                return;
            }

            timeGrid = new gridjs.Grid({
                sort: true,
                search: true,
                columns: ["Date", "Time"],
                data: rows,
                pagination: {
                    limit: 3,
                    summary: true
                },
                style: {
                    container: {
                        'background-color': '#878787',
                        'border-radius': '12px',
                        'alignment': 'center'
                    },
                    table: {
                        'width': '100%',
                        'border-collapse': 'collapse',
                    },
                    th: {
                        'background-color': '#f2f2f2',
                        'padding': '8px',
                        'text-align': 'left',
                    },
                    td: {
                        'padding': '8px',
                        'border-bottom': '1px solid #ddd',
                    },
                }
            });
            timeGrid.render(wrapper);

        }
        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");

        applySpaceClickPrevention(menuButton);

        function toggleMenu() {
            const isHidden = menu.hidden;
            menu.hidden = !isHidden;
            menuButton.setAttribute("aria-expanded", String(!menu.hidden));
        }

        menuButton.addEventListener("click", toggleMenu);
        function getTimeAndDateStyled() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const year = now.getFullYear();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${month}/${day}/${year} ${hours}:${minutes} ${ampm}`;
        }
    </script>
</body>

</html>
