<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <link rel="stylesheet" href = "stopwatchStyle.css"/>
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
</head>

<body>
    <h1>Stopwatch</h1>
    <p>This is a website that shows the current epoch time, and it will eventually be converted to a stopwatch.</p>
    <span id="time" class="timer">0</span>
    <button onclick="startStopwatch()">Start/Stop Stopwatch</button>
    <div id="wrapper"></div>

    <!-- Include Grid.js JavaScript -->
    <script src="https://unpkg.com/gridjs/dist/gridjs.production.min.js"></script>
    
    <!-- Initialize your grid -->
    <script>
      new gridjs.Grid({
        columns: ["", "Time"],
        data: [
          ["1", "insert time"],
          ["2", "insert time"]
        ]
      }).render(document.getElementById("wrapper"));
    </script>
    <script> 
        var timeList = JSON.parse(localStorage.getItem("times")) || [];
        for (var i = 0; i < timeList.length; i++) {
        }
        console.log(timeList);
        window.addEventListener("keyup", function(event) {
            if (event.key == " ") {
                startStopwatch();
            }
        });
        var time = new Date();
        var curTime = time.getTime();
        var timer;
        var timerStarted = false;
        var startTime;
        const timeDisp = document.getElementById("time");

        document.getElementById("time").innerHTML = `00:00:00`
        function startStopwatch() {
            if (timerStarted) {
                clearInterval(timer);
                timerStarted = false;
                timeDisp.style.color = "red"; 
                console.log(formattedTime);
                timeList.push(formattedTime);
                localStorage.setItem("times", JSON.stringify(timeList));
            } else {
                startTimeBase = new Date();
                var startTime = startTimeBase.getTime();
                timer = setInterval(function() {
                    time = new Date();
                    curTime = time.getTime();
                    totalTime = curTime - startTime;
                    var minutes = Math.floor(totalTime / 60000).toString().padStart(2, '0');
                    var seconds = Math.floor((totalTime % 60000) / 1000).toString().padStart(2, '0');
                    var milliseconds = (totalTime % 1000).toString().padStart(3, '0');
                    formattedTime = `${minutes}:${seconds}:${milliseconds}`;
                    document.getElementById("time").innerHTML = formattedTime;
                },10);
                timerStarted = true;
                timeDisp.style.color = "green"; 
            }
            
        }

        function loadTimeListGrid(elementId, columns) {
            // 1. Retrieve the stringified data from local storage
            const stringifiedData = localStorage.getItem("timeList");

            if (!stringifiedData) {
                console.warn("No 'timeList' data found in local storage.");
                return;
            }

            try {
                // 2. Parse the string back into a JavaScript array/object
                const parsedData = JSON.parse(stringifiedData);

                // 3. Initialize and render the Grid.js instance
                new Grid({
                columns: ["times"],
                data: parsedData,
                pagination: {
                    limit: 10
                },
                sort: true,
                search: true
                }).render(document.getElementById(elementId));

            } catch (error) {
                console.error("Failed to parse or render timeList grid:", error);
            }
        }
        
        
    </script>
</body>

</html>
