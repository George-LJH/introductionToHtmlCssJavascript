<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://unpkg.com/panic-overlay"></script>
    <script src="https://unpkg.com/ololog"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
         .background {
                background-color: #f0f0f0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 15px;
                width: 100%;
                height: 100%;
                max-width: 400px;
                max-height: 400px;
                border-radius: 10px;
            }
            form {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: lightblue;
        }


    </style>
</head>
<body>
    <div class = "background">
        <form onsubmit="submitGuess(event)">
            <input type="number" id="guessInput" min="0" max="100" step="1" required>
            <button type="submit">Submit Guess</button>
        </form>
        <div id="feedback">Guess a value to start the game!</div>
    </div>
    <pre id="errorDetails" hidden style="white-space: pre-wrap; color: #000000;"></pre>
    <script> 
        const answer = randInt(0, 100);
        // alert(answer);
        let min = 0;
        let max = 100;
        let guess;
        let inputBox = document.getElementById("guessInput");
        let feedbackBox = document.getElementById("feedback");
        function submitGuess(event) {
            event.preventDefault();

            guess = document.getElementById("guessInput").valueAsNumber;
            if (guess > answer) {
                max = guess;
                inputBox.max = max;
                feedbackBox.textContent = `Range from ${min} to ${max}`;
            } else if (guess < answer) {
                min = guess;
                inputBox.min = min;
                feedbackBox.textContent = `Range from ${min} to ${max}`;
            } else {
                feedbackBox.textContent = `You guessed the answer! It was ${answer}.`;
            }
            inputBox.value = "";
        }
        function randInt(min, max) {
            // function from https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/random
            const minCeiled = Math.ceil(min);
            const maxFloored = Math.floor(max);
            return Math.floor(Math.random() * (maxFloored - minCeiled + 1) + minCeiled);
        }
    </script>
</body>
</html>
